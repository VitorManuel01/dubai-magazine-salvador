name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25 + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dubai_migrations
          MYSQL_ROOT_PASSWORD: root-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/dubai_testes?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root-ci-password
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/dubai_testes?useSSL=false&allowPublicKeyRetrieval=true
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: root-ci-password
      MIGRATION_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/dubai_migrations?useSSL=false&allowPublicKeyRetrieval=true
      MIGRATION_TEST_DB_USERNAME: root
      MIGRATION_TEST_DB_PASSWORD: root-ci-password
      RUN_FLYWAY_MIGRATION_TEST: "true"
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters-123456789
      MIGRATION_TEST_JWT_SECRET: migration-ci-jwt-secret-with-more-than-thirty-two-characters
      MIGRATION_TEST_AUDIT_HMAC_SECRET: migration-ci-audit-secret-with-more-than-thirty-two-characters

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Permitir execução do Maven Wrapper
        run: chmod +x backend/mvnw

      - name: Criar banco isolado para a suíte normal
        run: >-
          docker exec "${{ job.services.mysql.id }}"
          mysql --user=root --password=root-ci-password
          --execute="CREATE DATABASE dubai_testes CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"

      - name: Validar migrations Flyway em banco vazio
        working-directory: backend
        run: ./mvnw -B -ntp -Dtest=FlywayMigrationCiIT test

      - name: Compilar e executar testes do backend
        working-directory: backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências reproduzivelmente
        working-directory: frontend
        run: npm ci

      - name: Verificar vulnerabilidades conhecidas
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Verificar padrões do código
        working-directory: frontend
        run: npm run lint

      - name: Testar isolamento da sessão
        working-directory: frontend
        run: npm run test:security

      - name: Gerar build de produção
        working-directory: frontend
        run: npm run build:production
