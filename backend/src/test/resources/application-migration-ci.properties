# Perfil exclusivo do teste de migrations executado pelo pipeline.
spring.datasource.url=${MIGRATION_TEST_DB_URL}
spring.datasource.username=${MIGRATION_TEST_DB_USERNAME}
spring.datasource.password=${MIGRATION_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.url=${MIGRATION_TEST_DB_URL}
spring.flyway.user=${MIGRATION_TEST_DB_USERNAME}
spring.flyway.password=${MIGRATION_TEST_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false

# Depois do Flyway, o Hibernate confirma que o schema criado atende às entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# O perfil existe somente para validar schema no CI; não deve expor servidor nem executar rotinas.
api.Security.token.secret=${MIGRATION_TEST_JWT_SECRET}
api.security.token.issuer=dubai-magazine-migration-ci
api.security.token.audience=dubai-magazine-migration-ci
app.security.audit.hmac-secret=${MIGRATION_TEST_AUDIT_HMAC_SECRET}
app.security.audit.cleanup.cron=-
app.security.require-https=false
app.security.public-rate-limit.enabled=false
app.upload.cleanup.enabled=false
app.upload.cleanup.cron=-
app.cors.allowed-origins=http://localhost
