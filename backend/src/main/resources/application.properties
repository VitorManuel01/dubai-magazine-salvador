spring.config.import=optional:file:${user.dir}/.env[.properties],optional:file:${user.dir}/../.env[.properties]
spring.application.name=dubaiMagazineSalvador
# Não há perfil padrão de propósito. A aplicação falha ao iniciar se o perfil
# não for informado explicitamente (development, preproduction, production ou test).
# DataSource configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:3000}

# JPA properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.jakarta.persistence.query.timeout=${DB_QUERY_TIMEOUT_MS:5000}
server.servlet.session.persistent=false

spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.file-size-threshold=0
app.upload.produtos-dir=${PRODUCT_IMAGES_DIR:uploads/produtos}
app.upload.cleanup.enabled=${PRODUCT_IMAGES_CLEANUP_ENABLED:true}
app.upload.cleanup.minimum-age=${PRODUCT_IMAGES_CLEANUP_MINIMUM_AGE:PT24H}
app.upload.cleanup.cron=${PRODUCT_IMAGES_CLEANUP_CRON:0 15 3 * * *}

# api.Security.token.secret = ${JWT_SECRET:my-secret-key}
api.Security.token.secret=${JWT_SECRET}
api.security.token.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
api.security.token.issuer=${JWT_ISSUER:dubai-magazine-api}
api.security.token.audience=${JWT_AUDIENCE:dubai-magazine-interno}
app.security.audit.hmac-secret=${AUDIT_HMAC_SECRET:${JWT_SECRET}}
app.security.audit.retention=${AUDIT_RETENTION:P180D}
app.security.audit.cleanup.max-rows=${AUDIT_CLEANUP_MAX_ROWS:10000}
app.security.audit.cleanup.cron=${AUDIT_CLEANUP_CRON:0 40 3 * * *}

# Bloqueia a conta por 20 minutos após 3 falhas consecutivas de autenticação.
app.security.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:3}
app.security.login.lock-duration=${LOGIN_LOCK_DURATION:PT20M}
app.security.login.ip.max-failed-attempts=${LOGIN_IP_MAX_FAILED_ATTEMPTS:20}
app.security.login.device.max-failed-attempts=${LOGIN_DEVICE_MAX_FAILED_ATTEMPTS:5}
app.security.login.origin-window=${LOGIN_ORIGIN_WINDOW:PT20M}
app.security.login.origin-block-duration=${LOGIN_ORIGIN_BLOCK_DURATION:PT20M}
app.security.login.initial-delay=${LOGIN_INITIAL_DELAY:PT1S}
app.security.login.max-delay=${LOGIN_MAX_DELAY:PT30S}
app.security.login.max-tracked-origins=${LOGIN_MAX_TRACKED_ORIGINS:50000}

# Contenção no próprio backend. O proxy deve aplicar uma camada adicional.
app.security.public-rate-limit.enabled=${PUBLIC_RATE_LIMIT_ENABLED:true}
app.security.public-rate-limit.catalog.capacity=${PUBLIC_CATALOG_RATE_CAPACITY:60}
app.security.public-rate-limit.catalog.refill-per-second=${PUBLIC_CATALOG_RATE_REFILL:1}
app.security.public-rate-limit.catalog.max-concurrent=${PUBLIC_CATALOG_MAX_CONCURRENT:4}
app.security.public-rate-limit.images.capacity=${PUBLIC_IMAGE_RATE_CAPACITY:240}
app.security.public-rate-limit.images.refill-per-second=${PUBLIC_IMAGE_RATE_REFILL:4}
app.security.public-rate-limit.max-tracked-origins=${PUBLIC_RATE_MAX_ORIGINS:50000}
app.security.public-rate-limit.entry-ttl=${PUBLIC_RATE_ENTRY_TTL:PT20M}

# Baseline seguro, sobrescrito somente pelo perfil development.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=none
app.security.require-https=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.max-http-request-header-size=16KB
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT:5s}
server.tomcat.max-connections=${SERVER_MAX_CONNECTIONS:200}
server.tomcat.accept-count=${SERVER_ACCEPT_COUNT:100}
server.tomcat.threads.max=${SERVER_MAX_THREADS:80}
server.tomcat.threads.min-spare=${SERVER_MIN_SPARE_THREADS:8}
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=20MB

# Alternate Server Port
server.port=8081
