spring.config.import=optional:file:${user.dir}/.env[.properties],optional:file:${user.dir}/../.env[.properties]
spring.application.name=dubaiMagazineSalvador
# DataSource configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# JPA properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.produtos-dir=${PRODUCT_IMAGES_DIR:uploads/produtos}

# api.Security.token.secret = ${JWT_SECRET:my-secret-key}
api.Security.token.secret=${JWT_SECRET}
api.security.token.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Bloqueia a conta por 20 minutos após 3 falhas consecutivas de autenticação.
app.security.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:3}
app.security.login.lock-duration=${LOGIN_LOCK_DURATION:PT20M}

# Alternate Server Port
server.port=8081
server.forward-headers-strategy=framework

# Em produção, configure REQUIRE_HTTPS=true e informe a origem HTTPS do frontend.
app.security.require-https=${REQUIRE_HTTPS:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
